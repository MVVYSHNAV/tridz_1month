<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 text-white">

    <div class="w-full flex flex-col items-center">
        <header class="sm:w-2/6 w-4/6 text-center font-bold">
            <h2 class="py-12 text-3xl text-black">Todo List</h2>
        </header>

        <form class="flex flex-col sm:w-2/6 w-4/6 gap-3" id="task-form">
            <div class="flex gap-3">
                <input type="text" class="bg-gray-800 rounded-xl w-4/6 border-2 border-amber-600 px-4 py-2 text-white outline-none taskinput" placeholder="Enter a task..." />
                <button type="submit" class="bg-green-500 p-4 rounded-xl w-32 font-bold text-white flex items-center justify-center gap-2 cursor-pointer taskbtn">
                    Add
                </button>
                <button type="button" class="bg-red-500 p-4 rounded-xl w-32 font-bold text-white flex items-center justify-center gap-2 cursor-pointer clearbtn">
                    Clear
                </button>
            </div>
            <div class="flex gap-3">
                <div class="bg-gray-800 sm:w-2/6 w-4/6 text-center h-14 py-4 text-white  rounded-lg mx-auto">
                    <select class="bg-gray-800 outline-none cursor-pointer taskselect">
                        <option value="all">All</option>
                        <option value="completed">Completed</option>
                        <option value="incomplete">Incomplete</option>
                    </select>
                </div>
                <!-- <div class="flex text-white font-bold gap-6 mt-5 ">
                    <button class="bg-amber-500 p-2 w-24 rounded-lg seeAllBtn ">Show All</button>
                    </div>> -->
                <div class="bg-white w-56 rounded-lg shadow-xl text-center border-2 border-[black]">
                    <h2 class="text-gray-700 font-bold text-sm pagecount py-4 ">page</h2>
                </div>
            </div>
            
        </form>
        
        <div class="sm:w-2/6 w-4/6 mt-8 mx-auto taskcontainer overflow-y-scroll max-h-96 whitespace-nowrap [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
            <ul class="tasklist space-y-2">
                
            </ul>
            <div class="flex text-white font-bold gap-6 mt-5 ">
                <button class="bg-blue-500 p-2 w-24 rounded-lg prevBtn">Prev</button>
               
                <button class="bg-blue-500 p-2 w-24 rounded-lg nextBtn">See More</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
